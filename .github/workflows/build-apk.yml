name: Build launcher APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The runner image already ships the Android SDK; just accept licences and make sure API 34 exists.
      - name: Prepare Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          echo "using $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" || true
          echo "sdk.dir=$ANDROID_HOME" > launcher/local.properties

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Download Outfit font (falls back to system font if this fails)
        run: |
          mkdir -p launcher/app/src/main/assets/fonts
          for w in Thin Light Regular; do
            curl -fsSL -o launcher/app/src/main/assets/fonts/Outfit-$w.ttf \
              https://raw.githubusercontent.com/Outfitio/Outfit-Fonts/main/fonts/ttf/Outfit-$w.ttf || rm -f launcher/app/src/main/assets/fonts/Outfit-$w.ttf
          done
          ls -la launcher/app/src/main/assets/fonts

      - name: Build debug APK
        working-directory: launcher
        run: gradle assembleDebug -PtvMinSdk=21 --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: tv-launcher-apk
          path: launcher/app/build/outputs/apk/debug/app-debug.apk
